<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- ─── FONTS & STYLES ─── -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.32; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(15px, -12px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-18px, 14px); }
      }
      @keyframes borderFlow {
        0% { stop-color: #6366f1; }
        33% { stop-color: #a855f7; }
        66% { stop-color: #06b6d4; }
        100% { stop-color: #6366f1; }
      }
      @keyframes scanline {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      @keyframes radarWave {
        0% { r: 3; opacity: 1; stroke-width: 1.5; }
        100% { r: 12; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes badgePulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.35)); }
        50% { filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.65)); }
      }
      @keyframes textGlowShift {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      @keyframes circuitSignal {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .neural-glow {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 450px 160px;
      }
      .float-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .float-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite;
      }
      .text-aura {
        animation: textGlowShift 4s ease-in-out infinite;
      }
      .radar-ripple {
        animation: radarWave 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .radar-ripple-delay {
        animation: radarWave 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) 1.2s infinite;
      }
      .circuit-line {
        stroke-dasharray: 20 80;
        animation: circuitSignal 6s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .neural-glow, .float-1, .float-2, .badge-glow, .text-aura, .radar-ripple, .circuit-line {
          animation: none !important;
        }
      }
    </style>

    <!-- ─── BACKGROUND GRADIENTS ─── -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c0d16" />
      <stop offset="60%" stop-color="#07070b" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>

    <!-- Neural Energy Glow Blobs -->
    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d0e17" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="border-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="ultra-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Masks -->
    <radialGradient id="grid-fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="fade-mask">
      <rect width="900" height="320" fill="url(#grid-fade)" />
    </mask>

    <!-- Grid Patterns -->
    <pattern id="matrix-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#181a28" stroke-width="0.7" />
      <circle cx="0" cy="0" r="0.8" fill="#312e81" opacity="0.6" />
    </pattern>

    <pattern id="micro-dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="0.5" fill="#2e3146" opacity="0.4" />
    </pattern>
  </defs>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║         BASE ENVIRONMENT LAYERS          ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->

  <!-- L1: Background Canvas -->
  <rect width="900" height="320" fill="url(#bg)" />

  <!-- L2: Micro Dots Texture -->
  <rect width="900" height="320" fill="url(#micro-dots)" />

  <!-- L3: Ambient Neural Glow Blobs -->
  <g class="neural-glow">
    <ellipse cx="450" cy="160" rx="360" ry="170" fill="url(#glow-core)" filter="url(#ultra-blur)" />
  </g>
  <g class="float-1">
    <ellipse cx="730" cy="110" rx="200" ry="130" fill="url(#glow-cyan)" filter="url(#ultra-blur)" />
  </g>
  <g class="float-2">
    <ellipse cx="170" cy="210" rx="220" ry="140" fill="url(#glow-purple)" filter="url(#ultra-blur)" />
  </g>

  <!-- L4: Tech Matrix Grid (Masked with Vignette) -->
  <rect width="900" height="320" fill="url(#matrix-grid)" mask="url(#fade-mask)" opacity="0.75" />

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║     NEURAL / AI SYNAPSE CIRCUIT LINES    ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->
  <g opacity="0.45">
    <!-- Left AI Circuit Pathway -->
    <path d="M 40 160 L 140 160 L 190 120 L 260 120" fill="none" stroke="#312e81" stroke-width="1.2" />
    <path d="M 40 160 L 140 160 L 190 120 L 260 120" fill="none" stroke="#6366f1" stroke-width="1.5" class="circuit-line" />
    <circle cx="140" cy="160" r="2.5" fill="#6366f1" />
    <circle cx="190" cy="120" r="2" fill="#a855f7" />
    <circle cx="260" cy="120" r="3" fill="#06b6d4" />

    <!-- Right AI Circuit Pathway -->
    <path d="M 860 160 L 760 160 L 710 200 L 640 200" fill="none" stroke="#0e7490" stroke-width="1.2" />
    <path d="M 860 160 L 760 160 L 710 200 L 640 200" fill="none" stroke="#06b6d4" stroke-width="1.5" class="circuit-line" />
    <circle cx="760" cy="160" r="2.5" fill="#06b6d4" />
    <circle cx="710" cy="200" r="2" fill="#10b981" />
    <circle cx="640" cy="200" r="3" fill="#6366f1" />
  </g>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║        TOP & BOTTOM ACCENT BEAMS         ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->
  <rect x="0" y="0" width="900" height="1" fill="#1e1e2d" />
  <rect x="0" y="319" width="900" height="1" fill="#1e1e2d" />

  <rect x="0" y="0" width="900" height="1.5" fill="url(#border-fade)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="0" y="318.5" width="900" height="1.5" fill="url(#border-fade)">
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║         HUD CORNER BRACKETS & MARKS      ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->
  <!-- Top-Left Bracket -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 24 44 L 24 24 L 44 24" />
    <circle cx="24" cy="24" r="2" fill="#6366f1" />
    <!-- Crosshair ticks -->
    <line x1="20" y1="24" x2="16" y2="24" stroke="#4338ca" stroke-width="1" />
    <line x1="24" y1="20" x2="24" y2="16" stroke="#4338ca" stroke-width="1" />
  </g>

  <!-- Top-Right Bracket -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 876 44 L 876 24 L 856 24" />
    <circle cx="876" cy="24" r="2" fill="#06b6d4" />
    <line x1="880" y1="24" x2="884" y2="24" stroke="#0891b2" stroke-width="1" />
    <line x1="876" y1="20" x2="876" y2="16" stroke="#0891b2" stroke-width="1" />
  </g>

  <!-- Bottom-Left Bracket -->
  <g stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 24 276 L 24 296 L 44 296" />
    <circle cx="24" cy="296" r="2" fill="#a855f7" />
    <line x1="20" y1="296" x2="16" y2="296" stroke="#7e22ce" stroke-width="1" />
    <line x1="24" y1="300" x2="24" y2="304" stroke="#7e22ce" stroke-width="1" />
  </g>

  <!-- Bottom-Right Bracket -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 876 276 L 876 296 L 856 296" />
    <circle cx="876" cy="296" r="2" fill="#10b981" />
    <line x1="880" y1="296" x2="884" y2="296" stroke="#059669" stroke-width="1" />
    <line x1="876" y1="300" x2="876" y2="304" stroke="#059669" stroke-width="1" />
  </g>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║         HUD CORNER TECHNICAL LABELS      ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->

  <!-- Top-Left: System Identifier -->
  <g transform="translate(52, 28)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="8.5" font-weight="700" fill="#818cf8" letter-spacing="1.5">SYS // FULL-STACK &amp; AI AGENTIC ARCHITECTURE</text>
    <text y="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="7" font-weight="400" fill="#475569" letter-spacing="1.2">PROD_ENV · BUILD 2026.11 · VERIFIED DEPLOY</text>
  </g>

  <!-- Top-Right: Coordinates & Location -->
  <g transform="translate(848, 28)" text-anchor="end">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="8.5" font-weight="700" fill="#22d3ee" letter-spacing="1.5">LOC // RIYADH, SAUDI ARABIA</text>
    <text y="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="7" font-weight="400" fill="#475569" letter-spacing="1.2">COORDS: 24.7136° N, 46.6753° E · UTC+3</text>
  </g>

  <!-- Bottom-Left: Live Pulsing Radar Beacon -->
  <g transform="translate(52, 294)">
    <!-- Radar ripple rings -->
    <circle cx="5" cy="-2" r="3" fill="none" stroke="#10b981" class="radar-ripple" />
    <circle cx="5" cy="-2" r="3" fill="none" stroke="#22d3ee" class="radar-ripple-delay" />
    <!-- Center glowing dot -->
    <circle cx="5" cy="-2" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="1"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="8.5" font-weight="700" fill="#10b981" letter-spacing="1.5">SYSTEM ONLINE · OPEN FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Bottom-Right: Core Stack Badges -->
  <g transform="translate(848, 294)" text-anchor="end">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="1.6">NEXT.JS 16 · REACT 19 · TYPESCRIPT · SUPABASE · LLMs</text>
  </g>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║         CENTER HERO TYPOGRAPHY           ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->

  <!-- Deep Aura Glow Behind Name -->
  <text x="450" y="146" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="56" letter-spacing="14" fill="#6366f1"
        class="text-aura" filter="url(#soft-blur)">SALAH KHALED</text>

  <!-- Sharp Specular Foreground Name -->
  <text x="450" y="146" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="56" letter-spacing="14" fill="url(#name-gradient)"
        filter="url(#neon-glow)">SALAH KHALED</text>

  <!-- Animated Neon Horizon Divider -->
  <g transform="translate(450, 156)">
    <!-- Expanding accent line -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="url(#ai-gradient)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite" />
    </line>
    <!-- Center diamond pulse -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#06b6d4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </polygon>
    <!-- Accent nodes -->
    <circle cx="-160" cy="0" r="2.5" fill="#6366f1" />
    <circle cx="160" cy="0" r="2.5" fill="#10b981" />
  </g>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║      ROLE HUD BADGE (FULL-STACK & AI)     ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->
  <g transform="translate(450, 194)">
    <!-- Pill Capsule Container with Glow -->
    <g class="badge-glow">
      <rect x="-195" y="-15" width="390" height="30" rx="15"
            fill="url(#badge-bg)" stroke="url(#badge-border)" stroke-width="1.2" />
    </g>

    <!-- Tech Diamond Left & Right -->
    <path d="M -175 0 L -171 -3.5 L -167 0 L -171 3.5 Z" fill="#6366f1" />
    <path d="M 175 0 L 171 -3.5 L 167 0 L 171 3.5 Z" fill="#06b6d4" />

    <!-- Role Title Text -->
    <text x="0" y="4" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-weight="800" font-size="12.5" letter-spacing="4.5" fill="url(#ai-gradient)">
      FULL STACK &amp; AI SYSTEMS ENGINEER
    </text>
  </g>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║         ARCHITECTURAL MISSION BIO        ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->
  <g transform="translate(450, 240)">
    <text text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="400" font-size="11.5" fill="#94a3b8" letter-spacing="0.8">
      Engineering resilient full-stack architectures &amp; production AI platforms
    </text>
    <text y="16" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="400" font-size="10" fill="#475569" letter-spacing="1.2">
      HIGH CONCURRENCY · REALTIME SYSTEMS · INTUITIVE COMPUTATIONAL UX
    </text>
  </g>

</svg>
