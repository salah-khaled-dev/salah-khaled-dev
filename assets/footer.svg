<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0e0f18"/>
      <stop offset="100%" stop-color="#040407"/>
    </radialGradient>
    <linearGradient id="ai-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="top-line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="20%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <style>
    .accent-bar {
      animation: bar-glow 4s ease-in-out infinite;
    }
    @keyframes bar-glow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #6366f1); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #06b6d4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .accent-bar { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="95" fill="url(#bg)"/>

  <!-- Subtle center radial glow -->
  <ellipse cx="450" cy="45" rx="320" ry="60" fill="url(#center-glow)" filter="url(#blur-glow)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="900" height="1" fill="url(#top-line-fade)"/>

  <!-- Center accent bar with animation -->
  <rect class="accent-bar" x="350" y="0" width="200" height="2" rx="1" fill="url(#ai-accent)"/>

  <!-- Main text -->
  <text x="450" y="44" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="700" font-size="12" fill="#cbd5e1" letter-spacing="4">
    ARCHITECTING SCALABLE FULL-STACK &amp; INTELLIGENT SYSTEMS
  </text>

  <!-- Sub text -->
  <text x="450" y="64" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="2">
    © 2026 SALAH KHALED  ·  FULL-STACK &amp; AI SYSTEMS ENGINEER  ·  RIYADH, SA
  </text>

  <!-- Decorative elements -->
  <circle cx="260" cy="54" r="1.5" fill="#6366f1"/>
  <circle cx="640" cy="54" r="1.5" fill="#06b6d4"/>
  <line x1="270" y1="54" x2="330" y2="54" stroke="#1e1e2d" stroke-width="1"/>
  <line x1="570" y1="54" x2="630" y2="54" stroke="#1e1e2d" stroke-width="1"/>

  <!-- Bottom accent bar -->
  <rect class="accent-bar" x="380" y="82" width="140" height="1" rx="0.5" fill="url(#ai-accent)" opacity="0.6"/>
</svg>
